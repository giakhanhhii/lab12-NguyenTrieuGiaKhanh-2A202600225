services:
  redis:
    image: redis:7-alpine
    container_name: day12-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: day12-agent
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: ${PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AGENT_API_KEY: ${AGENT_API_KEY}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      ESTIMATED_INPUT_COST_PER_1K: ${ESTIMATED_INPUT_COST_PER_1K:-0.00015}
      ESTIMATED_OUTPUT_COST_PER_1K: ${ESTIMATED_OUTPUT_COST_PER_1K:-0.0006}
    ports:
      - "${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  app_net:
    driver: bridge

volumes:
  redis_data:
